<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Приём заявки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 16px;
            margin: 0;
        }
        h3 { margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h3>Новая заявка</h3>
    <form id="orderForm">
        <div class="form-group">
            <label>Телефон клиента:</label>
            <input type="tel" id="phone" placeholder="8 (978) 000-00-00" required>
        </div>
        <div class="form-group">
            <label>Устройство / Модель:</label>
            <input type="text" id="device" placeholder="Epson L355" required>
        </div>
        <div class="form-group">
            <label>Причина / Неисправность:</label>
            <textarea id="defect" rows="3" placeholder="Завоздушено / Не захватывает бумагу"></textarea>
        </div>
        <div class="form-group">
            <label>Комплектация:</label>
            <input type="text" id="equipment" placeholder="Без комплектации">
        </div>
        <button type="submit">Сохранить заявку</button>
    </form>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const data = {
                phone: document.getElementById('phone').value,
                device: document.getElementById('device').value,
                defect: document.getElementById('defect').value,
                equipment: document.getElementById('equipment').value
            };

            // Отправляем сформированный JSON обратно боту
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
